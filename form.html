<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/form.css">
</head>

<body>

    <form class="contact-form">

        <label class="contact-form-field-label" for="user-first-name">
            Your name
        </label>

        <input 
            class="contact-form-input" 
            type="text" 
            placeholder="Oleksandr" 
            id="user-first-name"
            name="user-name"
            required

            pattern="[A-Za-z]+" 
            title="Alexandr"


        >

        <label class="contact-form-field-label" for="user-email">
            Your email
        </label>
        <input 
            class="contact-form-input" 
            type="email" 
            placeholder="olexandr@gmail.com" 
            id="user-email"
            name="user-email"
            required
        >
        <label class="contact-form-field-label" for="user-phone">
            Your phone
        </label>
        <input 
            class="contact-form-input" 
            type="tel" 
            placeholder="xxx-xx-xx" 
            id="user-phone"
            name="user-phone"
            required

            pattern="[0-9]{3}-[0-9]{2}-[0-9]{2}"
            title="xxx-xx-xx"

        >

        <fieldset class="contact-form-fieldset">
            <legend>Select your age</legend>

            <label for="user-age-18-25">18-25</label>
            <input type="radio" name="user-age" value="18-25" id="user-age-18-25">

            <label for="user-age-26-5">26-35</label>
            <input type="radio" name="user-age" value="26-35" id="user-age-26-5">

            <label for="user-age-35+">35+</label>
            <input type="radio" name="user-age" value="35+" id="user-age-35+"> 
        </fieldset>

        <fieldset class="contact-form-fieldset">
            <legend>Select your hobby</legend>

            <label>
                photography
                <input type="checkbox" name="user-hobby" value="photography">
            </label>
            
            <label>
                coding
                <input type="checkbox" name="user-hobby" value="coding">
            </label>

            <label>
                swimming
                <input type="checkbox" name="user-hobby" value="swimming">
            </label>
        </fieldset>

        <textarea class="textarea" name="user-message" placeholder="Your message" >Text default</textarea>



        <div class="contact-form-btn-wrapper">
            <button class="contact-form-btn contact-form-btn-submit" type="submit">
                submit
            </button>
            <button class="contact-form-btn contact-form-btn-reset" type="reset">
                reset
            </button>
        </div>


        

    </form>
    
</body>

</html>
